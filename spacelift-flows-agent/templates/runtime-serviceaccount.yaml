{{- if .Values.agent.kubernetes.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "spacelift-flows-agent.runtimeServiceAccountName" . }}
  namespace: {{ include "spacelift-flows-agent.runtimeNamespace" . }}
  labels:
    {{- include "spacelift-flows-agent.labels" . | nindent 4 }}
  {{- with .Values.agent.kubernetes.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Runtime pods run app code and user expressions, so they get no API token.
automountServiceAccountToken: false
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
