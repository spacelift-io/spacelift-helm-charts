name: Chart publish (reusable)

on:
  workflow_call:
    inputs:
      chart_version_strategy:
        description: "How to derive CHART_VERSION: 'timestamp' or 'tag'."
        type: string
        required: true
      chart_version_prefix:
        description: "Prefix used when chart_version_strategy=timestamp, e.g. 0.0.1-preprod."
        type: string
        default: ""

      r2_bucket:
        type: string
        required: true
      r2_endpoint:
        type: string
        required: true

      cloudflare_zone_id:
        type: string
        required: true
      cloudflare_purge_prefix:
        type: string
        required: true

      smoke_pull_repo_url:
        description: "Helm repo URL used by the smoke pull job, e.g. https://downloads.spacelift.io/helm."
        type: string
        required: true
      smoke_pull_devel:
        description: "Pass --devel to `helm pull` (needed when chart versions look like prereleases)."
        type: boolean
        default: false

    secrets:
      # These four are stored as repo *secrets* today but are not actually
      # sensitive (region, bucket name, role ARN, CloudFront distribution id).
      aws_region:
        required: true
      aws_role_to_assume:
        required: true
      aws_s3_bucket:
        required: true
      cf_distribution_id:
        required: true

      r2_access_key_id:
        required: true
      r2_secret_access_key:
        required: true
      cloudflare_purge_token:
        required: true

env:
  HELM_VERSION: "3.20.0"

jobs:
  registry:
    name: Publish the chart to the Helm repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@main

      - name: Install helm
        uses: azure/setup-helm@v5
        with:
           version: ${{ env.HELM_VERSION }}

      - name: Install Helm S3 Plugin
        run: helm plugin install https://github.com/hypnoglow/helm-s3.git

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ secrets.aws_region }}
          role-to-assume: ${{ secrets.aws_role_to_assume }}
          role-duration-seconds: 900

      - name: Add the Spacelift Helm registry
        run: helm repo add spacelift s3://${{ secrets.aws_s3_bucket }}/helm
        # The first time this step runs the index file won't exist, so allow the step to fail
        continue-on-error: true

      - name: Set chart version number
        env:
          STRATEGY: ${{ inputs.chart_version_strategy }}
          PREFIX: ${{ inputs.chart_version_prefix }}
        run: |
          case "$STRATEGY" in
            timestamp)
              ts=$(date +'%s')
              echo "CHART_VERSION=${PREFIX}.${ts}" >> "$GITHUB_ENV"
              ;;
            tag)
              if [[ "$GITHUB_REF_NAME" != v* ]]; then
                echo "Tag does not look like a valid version: $GITHUB_REF_NAME" >&2
                exit 1
              fi
              echo "CHART_VERSION=${GITHUB_REF_NAME:1}" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unknown chart_version_strategy: $STRATEGY" >&2
              exit 1
              ;;
          esac

      - name: Lint Spacelift PromEx chart
        run: helm lint spacelift-promex/

      - name: Lint Spacelift Worker Pool chart
        run: helm lint spacelift-worker-pool/

      - name: Lint Spacelift VCS Agent chart
        run: helm lint vcs-agent/

      - name: Lint spacelift-workerpool-controller chart
        run: helm lint spacelift-workerpool-controller/

      - name: Lint spacelift-self-hosted chart
        run: helm lint --strict spacelift-self-hosted/

      - name: Lint spacelift-flows chart
        run: helm lint --strict spacelift-flows/

      - name: Lint spacelift-flows-agent chart
        run: helm lint --strict spacelift-flows-agent/

      - name: Package Spacelift PromEx chart
        run: |
          helm package --version "$CHART_VERSION" --destination build/chart/spacelift-promex spacelift-promex/
          helm s3 push --force --relative build/chart/spacelift-promex/spacelift-promex-${CHART_VERSION}.tgz spacelift

      - name: Package Spacelift Worker Pool chart
        run: |
          helm package --version "$CHART_VERSION" --destination build/chart/worker-pool spacelift-worker-pool/
          helm s3 push --force --relative build/chart/worker-pool/spacelift-worker-${CHART_VERSION}.tgz spacelift

      - name: Package Spacelift VCS Agent chart
        run: |
          helm package --version "$CHART_VERSION" --destination build/chart/vcs-agent vcs-agent/
          helm s3 push --force --relative build/chart/vcs-agent/vcs-agent-${CHART_VERSION}.tgz spacelift

      - name: Package spacelift-workerpool-controller chart
        run: |
          helm dependency update spacelift-workerpool-controller/
          helm package --version "$CHART_VERSION" --destination build/chart/spacelift-workerpool-controller spacelift-workerpool-controller/
          helm s3 push --force --relative build/chart/spacelift-workerpool-controller/spacelift-workerpool-controller-${CHART_VERSION}.tgz spacelift

      - name: Package spacelift-self-hosted chart
        run: |
          helm package --version "$CHART_VERSION" --destination build/chart/spacelift-self-hosted spacelift-self-hosted/
          helm s3 push --force --relative build/chart/spacelift-self-hosted/spacelift-self-hosted-${CHART_VERSION}.tgz spacelift

      - name: Package spacelift-flows chart
        run: |
          helm package --version "$CHART_VERSION" --destination build/chart/spacelift-flows spacelift-flows/
          helm s3 push --force --relative build/chart/spacelift-flows/spacelift-flows-${CHART_VERSION}.tgz spacelift

      - name: Package spacelift-flows-agent chart
        run: |
          helm package --version "$CHART_VERSION" --destination build/chart/spacelift-flows-agent spacelift-flows-agent/
          helm s3 push --force --relative build/chart/spacelift-flows-agent/spacelift-flows-agent-${CHART_VERSION}.tgz spacelift

      - name: Publish charts to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.r2_access_key_id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.r2_secret_access_key }}
          AWS_SESSION_TOKEN: ""
          AWS_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_BUCKET: ${{ inputs.r2_bucket }}
          R2_ENDPOINT: ${{ inputs.r2_endpoint }}
        # helm-s3 is incompatible with R2: the plugin unconditionally sets
        # `x-amz-acl`, which R2 rejects with 501 NotImplemented for any value
        # (per the R2 S3 API compatibility doc — `x-amz-acl` is in the
        # unimplemented list for PutObject).
        run: |
          set -euo pipefail

          put() {
            aws s3api put-object \
              --bucket "$R2_BUCKET" \
              --key "$1" \
              --body "$2" \
              --endpoint-url "$R2_ENDPOINT" >/dev/null
          }

          STAGE=$(mktemp -d)
          find build/chart -maxdepth 2 -name '*.tgz' -exec cp {} "$STAGE/" \;
          ls -la "$STAGE"

          # Pull the current index.yaml so the rebuild merges rather than
          # truncates the chart catalog.
          if aws s3api head-object --bucket "$R2_BUCKET" --key helm/index.yaml \
               --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1; then
            aws s3api get-object \
              --bucket "$R2_BUCKET" \
              --key helm/index.yaml \
              --endpoint-url "$R2_ENDPOINT" \
              "$STAGE/previous-index.yaml" >/dev/null
            helm repo index --merge "$STAGE/previous-index.yaml" "$STAGE"
            rm -f "$STAGE/previous-index.yaml"
          else
            echo "No existing helm/index.yaml in R2 — generating fresh index."
            helm repo index "$STAGE"
          fi

          for tgz in "$STAGE"/*.tgz; do
            put "helm/$(basename "$tgz")" "$tgz"
          done

          # Upload the index last so consumers see a consistent state.
          put "helm/index.yaml" "$STAGE/index.yaml"

      - name: Purge Cloudflare cache
        uses: spacelift-io/public-shared-actions/actions/purge-cloudflare-cache@main
        with:
          zone_id: ${{ inputs.cloudflare_zone_id }}
          api_token: ${{ secrets.cloudflare_purge_token }}
          purge_prefixes: ${{ inputs.cloudflare_purge_prefix }}

      - name: Invalidate cache
        run: >-
          aws cloudfront create-invalidation
          --distribution-id ${{ secrets.cf_distribution_id }}
          --paths "/helm/*"

  test-new-version:
    name: Test that the new chart version can be pulled
    runs-on: ubuntu-latest
    needs: [registry]

    steps:
      - name: Install helm
        uses: azure/setup-helm@v5
        with:
           version: ${{ env.HELM_VERSION }}

      - name: Pull chart
        env:
          REPO_URL: ${{ inputs.smoke_pull_repo_url }}
          DEVEL_FLAG: ${{ inputs.smoke_pull_devel && '--devel' || '' }}
        run: |
          helm repo add spacelift "$REPO_URL"
          helm repo update
          helm pull $DEVEL_FLAG spacelift/spacelift-promex
          helm pull $DEVEL_FLAG spacelift/spacelift-worker
          helm pull $DEVEL_FLAG spacelift/vcs-agent
          helm pull $DEVEL_FLAG spacelift/spacelift-workerpool-controller
          helm pull $DEVEL_FLAG spacelift/spacelift-self-hosted
          helm pull $DEVEL_FLAG spacelift/spacelift-flows
          helm pull $DEVEL_FLAG spacelift/spacelift-flows-agent
