replicaCount: 1

image:
  repository: public.ecr.aws/spacelift/promex
  tag: v0.7.0
  pullPolicy: IfNotPresent


# The address to listen on for HTTP requests
listenAddress: ":9953"

# Labels to add to the deployment
labels:
    app.spacelift.io/example: spacelift-promx

# Annotations to add to the deployment
annotations:
  app.spacelift.io/example: spacelift-promx

# Annotations to add to the pod
# podAnnotations:
#   app.spacelift.io/example: spacelift-promx

# Labels to add to the pod
# podLabels:
#   app.spacelift.io/example: spacelift-promx

# Priority class name for the pod
priorityClassName: ""

## Your api endpoint, must be provided
#apiEndpoint: https://{myaccount}.app.spacelift.io
#
## Your api key id, must be provided
#apiKeyId: ""
#
## your api key secret, the secret should contain the key "SPACELIFT_PROMEX_API_KEY_SECRET"
## Required unless oidc.enabled is true.
#apiKeySecretName: ""
#
# nodeSelector allows you to schedule pods on specific nodes.
# Uncomment and modify the following lines to use it.
# nodeSelector:
#   kubernetes.io/arch: amd64
#   disktype: ssd

## Custom CA certificate to trust when connecting to the Spacelift API
## Use this when the endpoint uses a certificate chain not covered by system CAs
caCert:
  enabled: false
  # Name of the Kubernetes secret containing the CA certificate
  secretName: ""
  # Key within the secret that holds the PEM-encoded CA certificate
  secretKey: "ca.crt"
  # Directory to mount the CA certificate into
  mountPath: "/certs"

## OIDC API keys (key ID of the form "oidc::<issuer>::<key-id>").
## Instead of a static secret, a projected Kubernetes service-account token is mounted
## and passed to the exporter via SPACELIFT_PROMEX_API_KEY_SECRET_FILE. The kubelet rotates
## the token on disk and the exporter re-reads it on every refresh.
## Requires exporter image >= v0.11.0 (set image.tag accordingly).
## When enabled, apiKeySecretName is not used.
oidc:
  enabled: false
  # Audience of the projected token; must match what your Spacelift OIDC API key expects
  audience: ""
  # Requested token lifetime in seconds (kubelet minimum is 600)
  expirationSeconds: 3600
  # Directory the token is mounted into
  mountPath: "/var/run/secrets/spacelift"
  # File name of the token within mountPath
  tokenFileName: "token"

# Service account the pod runs as (the one whose token is projected when oidc.enabled).
# Defaults to the namespace's "default" service account when empty.
serviceAccountName: ""

nodeSelector: {}

# Extra environment variables to add to the container
# extraEnv:
#   - name: MY_ENV_VAR
#     value: "some-value"
#   - name: MY_SECRET_ENV_VAR
#     valueFrom:
#       secretKeyRef:
#         name: my-secret
#         key: my-key
extraEnv: []

# Extra envFrom sources (ConfigMaps/Secrets) to add to the container
# extraEnvFrom:
#   - configMapRef:
#       name: my-configmap
#   - secretRef:
#       name: my-secret
extraEnvFrom: []
