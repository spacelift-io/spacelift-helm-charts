{{- if .Values.ingressV6.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: server-v6
  labels:
    {{- include "spacelift.serverLabels" . | nindent 4 }}
  {{- with .Values.ingressV6.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  tls:
    - hosts:
        - {{ .Values.shared.serverHostname }}
      secretName: cert
  rules:
    - host: {{ .Values.shared.serverHostname }}
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "spacelift.fullname" $ }}-server
                port:
                  name: server
        {{- with .Values.ingressV6.extraPaths }}
          {{- tpl (toYaml .) $ | nindent 10 }}
        {{- end }}
    {{- with .Values.ingressV6.extraRules }}
      {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
{{- end }}
