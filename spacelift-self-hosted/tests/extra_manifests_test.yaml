# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: extra manifests
templates:
  - extra-manifests.yaml
tests:
  - it: renders no documents by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders every manifest through the Helm template engine
    release:
      name: example-release
    set:
      fullnameOverride: example-spacelift
      shared.image: public.ecr.aws/spacelift/backend:latest
      extraManifests:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: '{{ include "spacelift.fullname" . }}-settings'
          data:
            releaseName: "{{ .Release.Name }}"
            image: "{{ .Values.shared.image }}"
        - apiVersion: v1
          kind: Secret
          metadata:
            name: '{{ printf "%s-credentials" .Release.Name }}'
          stringData:
            token: '{{ printf "%s-token" .Release.Name }}'
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ConfigMap
        documentIndex: 0
      - equal:
          path: metadata.name
          value: example-spacelift-settings
        documentIndex: 0
      - equal:
          path: data.releaseName
          value: example-release
        documentIndex: 0
      - equal:
          path: data.image
          value: public.ecr.aws/spacelift/backend:latest
        documentIndex: 0
      - isKind:
          of: Secret
        documentIndex: 1
      - equal:
          path: metadata.name
          value: example-release-credentials
        documentIndex: 1
      - equal:
          path: stringData.token
          value: example-release-token
        documentIndex: 1
