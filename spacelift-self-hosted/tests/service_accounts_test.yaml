# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: service account selection
templates:
  - serviceaccount.yaml
  - server-serviceaccount.yaml
  - drain-serviceaccount.yaml
  - scheduler-serviceaccount.yaml
  - vcs-gateway-serviceaccount.yaml
  - server-deployment.yaml
  - drain-deployment.yaml
  - scheduler-deployment.yaml
  - vcs-gateway-deployment.yaml
set:
  scheduler.enabled: true
  vcsGateway.enabled: true
  vcsGateway.domain: vcs-gateway.example.com
tests:
  - it: uses the chart-managed shared service account by default
    asserts:
      - isKind:
          of: ServiceAccount
        template: serviceaccount.yaml
      - equal:
          path: metadata.name
          value: spacelift-backend
        template: serviceaccount.yaml
      - hasDocuments:
          count: 0
        template: server-serviceaccount.yaml
      - hasDocuments:
          count: 0
        template: drain-serviceaccount.yaml
      - hasDocuments:
          count: 0
        template: scheduler-serviceaccount.yaml
      - hasDocuments:
          count: 0
        template: vcs-gateway-serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: spacelift-backend
        template: server-deployment.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: spacelift-backend
        template: drain-deployment.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: spacelift-backend
        template: scheduler-deployment.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: spacelift-backend
        template: vcs-gateway-deployment.yaml

  - it: uses an externally managed shared service account without creating it
    set:
      serviceAccount.create: false
      serviceAccount.name: existing-backend
    asserts:
      - hasDocuments:
          count: 0
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-backend
        template: server-deployment.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-backend
        template: drain-deployment.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-backend
        template: scheduler-deployment.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-backend
        template: vcs-gateway-deployment.yaml

  - it: creates and selects component-specific service accounts
    set:
      serviceAccount.create: false
      serviceAccount.name: existing-backend
      server.serviceAccount.create: true
      server.serviceAccount.name: custom-server
      drain.serviceAccount.create: true
      drain.serviceAccount.name: custom-drain
      scheduler.serviceAccount.create: true
      scheduler.serviceAccount.name: custom-scheduler
      vcsGateway.serviceAccount.create: true
      vcsGateway.serviceAccount.name: custom-vcs-gateway
    asserts:
      - equal:
          path: metadata.name
          value: custom-server
        template: server-serviceaccount.yaml
      - equal:
          path: metadata.name
          value: custom-drain
        template: drain-serviceaccount.yaml
      - equal:
          path: metadata.name
          value: custom-scheduler
        template: scheduler-serviceaccount.yaml
      - equal:
          path: metadata.name
          value: custom-vcs-gateway
        template: vcs-gateway-serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-server
        template: server-deployment.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-drain
        template: drain-deployment.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-scheduler
        template: scheduler-deployment.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-vcs-gateway
        template: vcs-gateway-deployment.yaml
